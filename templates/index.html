<!DOCTYPE html>
<html lang="sw" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherStation - Smart Monitoring</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0a1128;
            --sidebar-bg: #0f1c3f;
            --card-bg: #162247;
            --accent-blue: #3a86ff;
            --text-white: #ffffff;
            --text-gray: #8d99ae;
            --green: #2ec4b6;
            --orange: #ff9f1c;
            --red: #e71d36;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-blue);
            margin-bottom: 30px;
        }

        .sidebar-brand i {
            font-size: 1.5rem;
        }

        .sidebar-menu {
            list-style: none;
            flex-grow: 1;
        }

        .sidebar-menu li {
            margin-bottom: 10px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-gray);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: var(--accent-blue);
            color: var(--text-white);
        }

        .sidebar-footer {
            font-size: 0.85rem;
            color: var(--text-gray);
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
        }

        .lang-btn {
            background-color: var(--card-bg);
            color: var(--text-white);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .lang-btn:hover {
            background-color: var(--accent-blue);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid var(--accent-blue);
        }

        .card.temp { border-left-color: var(--red); }
        .card.humidity { border-left-color: var(--accent-blue); }
        .card.rain { border-left-color: var(--green); }
        .card.wind { border-left-color: var(--orange); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-gray);
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .card-value {
            font-size: 2rem;
            font-weight: bold;
        }

        /* Charts & Tables Section */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                width: 80px;
                padding: 15px 10px;
            }
            .sidebar-brand span, .sidebar-menu span, .sidebar-footer {
                display: none;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
        }

        .panel h3 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        /* Table Design */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .history-table th, .history-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .history-table th {
            color: var(--text-gray);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div>
            <div class="sidebar-brand">
                <i class="fa-solid fa-cloud-sun"></i>
                <span data-sw="Kituo Hewa" data-en="WeatherStation">WeatherStation</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active"><i class="fa-solid fa-chart-pie"></i> <span data-sw="Dashibodi" data-en="Dashboard">Dashboard</span></a></li>
                <li><a href="#"><i class="fa-solid fa-clock-rotate-left"></i> <span data-sw="Historia" data-en="History">History</span></a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> <span data-sw="Mipangilio" data-en="Settings">Settings</span></a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <p>&copy; 2026 Smart Agri</p>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <header class="header">
            <h1 id="pageTitle" data-sw="Taarifa za Hali ya Hewa" data-en="Weather Monitoring Dashboard">Taarifa za Hali ya Hewa</h1>
            <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">EN / SW</button>
        </header>

        <!-- Cards Section -->
        <section class="cards-grid">
            <div class="card temp">
                <div class="card-header">
                    <span data-sw="Joto la Hewa" data-en="Temperature">Joto la Hewa</span>
                    <i class="fa-solid fa-temperature-high"></i>
                </div>
                <div class="card-value" id="tempVal">--°C</div>
            </div>
            <div class="card humidity">
                <div class="card-header">
                    <span data-sw="Unyevu kwenye Hewa" data-en="Humidity">Unyevu kwenye Hewa</span>
                    <i class="fa-solid fa-droplet"></i>
                </div>
                <div class="card-value" id="humVal">--%</div>
            </div>
            <div class="card rain">
                <div class="card-header">
                    <span data-sw="Kiwango cha Mvua" data-en="Rainfall">Kiwango cha Mvua</span>
                    <i class="fa-solid fa-cloud-rain"></i>
                </div>
                <div class="card-value" id="rainVal">-- mm</div>
            </div>
            <div class="card wind">
                <div class="card-header">
                    <span data-sw="Kasi ya Upepo" data-en="Wind Speed">Kasi ya Upepo</span>
                    <i class="fa-solid fa-wind"></i>
                </div>
                <div class="card-value" id="windVal">-- m/s</div>
            </div>
        </section>

        <!-- Charts and Tables -->
        <section class="dashboard-grid">
            <div class="panel">
                <h3 data-sw="Mwenendo wa Joto na Unyevu" data-en="Temperature & Humidity Trend">Mwenendo wa Joto na Unyevu</h3>
                <canvas id="weatherChart" height="120"></canvas>
            </div>
            <div class="panel">
                <h3 data-sw="Rekodi za Hivi Karibuni" data-en="Recent Logs">Rekodi za Hivi Karibuni</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th data-sw="Muda" data-en="Time">Muda</th>
                            <th data-sw="Joto" data-en="Temp">Joto</th>
                            <th data-sw="Unyevu" data-en="Hum">Unyevu</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <tr>
                            <td>12:00</td>
                            <td>28°C</td>
                            <td>75%</td>
                        </tr>
                        <tr>
                            <td>12:30</td>
                            <td>29°C</td>
                            <td>72%</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // Lugha Dynamic Toggle
        let currentLang = 'sw';
        function toggleLanguage() {
            currentLang = currentLang === 'sw' ? 'en' : 'sw';
            document.getElementById('htmlRoot').setAttribute('lang', currentLang);
            
            const elements = document.querySelectorAll('[data-sw]');
            elements.forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });
        }

        // Setup Chart.js
        const ctx = document.getElementById('weatherChart').getContext('2d');
        const weatherChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['10:00', '10:30', '11:00', '11:30', '12:00', '12:30'],
                datasets: [{
                    label: 'Joto (°C)',
                    data: [26, 27, 27.5, 28, 28.5, 29],
                    borderColor: '#e71d36',
                    backgroundColor: 'rgba(231, 29, 54, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#ffffff' } }
                },
                scales: {
                    x: { ticks: { color: '#8d99ae' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { ticks: { color: '#8d99ae' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });
    </script>
</body>
</html>
